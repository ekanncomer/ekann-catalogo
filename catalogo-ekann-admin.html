<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKANN — Admin Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<style>
:root{--orange:#F97316;--orange-dk:#ea6a0a;--black:#0a0a0a;--dark:#111;--card:#161616;--card2:#1c1c1c;--border:#2a2a2a;--text:#f0f0f0;--muted:#777;--green:#22c55e;--red:#ef4444;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--orange);border-radius:14px;padding:40px;width:100%;max-width:380px;text-align:center}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--orange);letter-spacing:.14em;margin-bottom:8px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
.field{margin-bottom:14px;text-align:left}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);font-family:'Barlow',sans-serif;font-size:14px;padding:10px 14px;border-radius:8px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--orange)}
.btn-login{width:100%;background:var(--orange);color:#fff;border:none;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.08em;text-transform:uppercase;padding:12px;cursor:pointer;margin-top:8px;transition:background .15s}
.btn-login:hover{background:var(--orange-dk)}
.login-err{color:var(--red);font-size:12px;margin-top:10px;min-height:18px}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--dark);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:100}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--orange);letter-spacing:.12em}
.logo span{color:var(--muted);font-size:13px;font-family:'Barlow',sans-serif;font-weight:600;letter-spacing:.06em;margin-left:10px}
.topbar-right{display:flex;align-items:center;gap:12px}
.search-in{background:var(--card);border:1px solid var(--border);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:7px 14px;border-radius:999px;outline:none;width:240px;transition:border-color .2s}
.search-in:focus{border-color:var(--orange)}
.btn-new{background:var(--orange);color:#fff;border:none;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:7px 18px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .15s}
.btn-new:hover{background:var(--orange-dk)}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:999px;font-size:12px;padding:5px 12px;cursor:pointer;transition:all .15s}
.btn-logout:hover{border-color:var(--red);color:var(--red)}

/* LAYOUT */
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:220px;flex-shrink:0;background:var(--dark);border-right:1px solid var(--border);padding:16px 0;overflow-y:auto}
.side-title{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);padding:0 16px 8px}
.side-item{padding:9px 16px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);transition:color .15s,background .15s;border-left:2px solid transparent;display:flex;align-items:center;justify-content:space-between}
.side-item:hover{color:var(--text);background:var(--card)}
.side-item.active{color:var(--orange);border-left-color:var(--orange);background:rgba(249,115,22,.07)}
.side-count{font-size:10px;background:var(--card2);padding:1px 6px;border-radius:999px;color:var(--muted)}
.main{flex:1;overflow-y:auto;padding:24px}

/* TABLE */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.table-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;color:#fff}
.table-sub{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 16px;text-align:left;border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid rgba(42,42,42,.6);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.018)}
.td-img{width:48px;height:36px;border-radius:6px;overflow:hidden;background:var(--card2);flex-shrink:0}
.td-img img{width:100%;height:100%;object-fit:cover;display:block}
.td-img .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.3}
.td-name{font-weight:600;color:#fff}
.td-sku{font-size:11px;color:var(--orange);font-weight:700;letter-spacing:.08em}
.td-cat{font-size:11px;color:var(--muted)}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em}
.badge.on{background:rgba(34,197,94,.15);color:var(--green)}
.badge.off{background:rgba(239,68,68,.12);color:var(--red)}
.actions{display:flex;gap:6px}
.btn-edit,.btn-del{border:none;border-radius:6px;font-size:11px;font-weight:700;padding:5px 12px;cursor:pointer;transition:all .15s;font-family:'Barlow',sans-serif}
.btn-edit{background:var(--card2);color:var(--text)}
.btn-edit:hover{background:var(--orange);color:#fff}
.btn-del{background:var(--card2);color:var(--muted)}
.btn-del:hover{background:var(--red);color:#fff}

/* FORM MODAL */
.fmodal-bg{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);justify-content:center;align-items:flex-start;padding:40px 16px;overflow-y:auto}
.fmodal-bg.open{display:flex}
.fmodal{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--orange);border-radius:14px;width:100%;max-width:700px;padding:28px 32px}
.fmodal-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.06em;color:#fff;margin-bottom:24px;display:flex;justify-content:space-between;align-items:center}
.fclose{background:var(--card2);border:1px solid var(--border);color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.fclose:hover{border-color:var(--red);color:var(--red)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.form-grid .full{grid-column:1/-1}
.flabel{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.finput,.fselect,.ftextarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);font-family:'Barlow',sans-serif;font-size:13px;padding:9px 12px;border-radius:8px;outline:none;transition:border-color .2s}
.finput:focus,.fselect:focus,.ftextarea:focus{border-color:var(--orange)}
.ftextarea{resize:vertical;min-height:80px;font-size:13px;line-height:1.5}
.fselect{cursor:pointer}
.specs-editor{display:flex;flex-direction:column;gap:6px}
.spec-row-edit{display:flex;gap:6px}
.spec-row-edit input{flex:1}
.btn-spec-add,.btn-spec-del{border:none;border-radius:6px;font-size:18px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:var(--card2);color:var(--muted)}
.btn-spec-add{background:rgba(249,115,22,.15);color:var(--orange)}
.btn-spec-add:hover{background:var(--orange);color:#fff}
.btn-spec-del:hover{background:var(--red);color:#fff}
.imgs-editor{display:flex;flex-direction:column;gap:6px}
.img-row{display:flex;gap:6px;align-items:center}
.img-row input{flex:1}
.img-preview{width:40px;height:30px;border-radius:4px;overflow:hidden;background:var(--card2);flex-shrink:0}
.img-preview img{width:100%;height:100%;object-fit:cover;display:block}
.vids-editor{display:flex;flex-direction:column;gap:6px}
.fform-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.btn-cancel{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:10px 22px;cursor:pointer;transition:all .15s}
.btn-cancel:hover{border-color:var(--text);color:var(--text)}
.btn-save{background:var(--orange);color:#fff;border:none;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:10px 28px;cursor:pointer;transition:background .15s}
.btn-save:hover{background:var(--orange-dk)}
.btn-save:disabled{opacity:.5;cursor:not-allowed}

/* MISC */
.loading{padding:60px;text-align:center;color:var(--muted)}
.spin{width:30px;height:30px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:10px 22px;border-radius:999px;z-index:99999;letter-spacing:.04em;animation:tin .3s ease}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(10px)}}
.empty-state{padding:48px;text-align:center;color:var(--muted)}

.toggle-wrap{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.toggle{width:40px;height:22px;background:var(--border);border-radius:999px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--orange)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s}
.toggle.on::after{left:21px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">EKANN</div>
    <div class="login-sub">Panel de Administración — Catálogo</div>
    <div class="field"><label>Correo</label><input id="l-email" type="email" placeholder="admin@ekann.com"></div>
    <div class="field"><label>Contraseña</label><input id="l-pass" type="password"></div>
    <button class="btn-login" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="l-err"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:8px">
      <div class="logo">EKANN <span>Admin — Catálogo</span></div>
    </div>
    <div class="topbar-right">
      <input class="search-in" id="search-in" type="text" placeholder="🔍 Buscar en catálogo..." autocomplete="off">
      <button class="btn-new" onclick="openForm()">+ Nuevo producto</button>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="side-title" style="margin-top:8px">Categorías</div>
      <div id="sidebar-cats"></div>
    </div>
    <div class="main" id="main">
      <div class="loading"><div class="spin"></div>Cargando...</div>
    </div>
  </div>
</div>

<!-- FORM MODAL -->
<div class="fmodal-bg" id="fmodal-bg" onclick="if(event.target===this)closeForm()">
  <div class="fmodal">
    <div class="fmodal-title">
      <span id="form-title">Nuevo Producto</span>
      <button class="fclose" onclick="closeForm()">×</button>
    </div>
    <div class="form-grid">
      <div class="full">
        <label class="flabel">Nombre del producto *</label>
        <input class="finput" id="f-nombre" placeholder="Ej: Winch Warn de 12,000 lbs">
      </div>
      <div>
        <label class="flabel">SKU / Código</label>
        <input class="finput" id="f-sku" placeholder="Ej: 119-105440">
      </div>
      <div>
        <label class="flabel">Marca</label>
        <input class="finput" id="f-marca" placeholder="Ej: WARN, ECCO, Feniex...">
      </div>
      <div class="full">
        <label class="flabel">Categoría *</label>
        <select class="fselect" id="f-cat">
          <option value="">— Selecciona —</option>
          <option>Accesorios Eléctricos</option>
          <option>Accesorios para Camión</option>
          <option>Bandas y Eslingas de Carga</option>
          <option>Bandas y Matracas</option>
          <option>Cables</option>
          <option>Cadenas</option>
          <option>Dollys</option>
          <option>Ganchos</option>
          <option>Iluminación LED</option>
          <option>Peras</option>
          <option>Refacciones Hidráulicas</option>
          <option>Refacciones y Aditamentos</option>
          <option>Torretas</option>
          <option>Winch</option>
        </select>
      </div>
      <div class="full">
        <label class="flabel">Descripción</label>
        <textarea class="ftextarea" id="f-desc" placeholder="Descripción general del producto..."></textarea>
      </div>
      <div class="full">
        <label class="flabel">Especificaciones / Características</label>
        <div class="specs-editor" id="specs-editor"></div>
        <button onclick="addSpec()" style="margin-top:8px;background:rgba(249,115,22,.1);border:1px dashed rgba(249,115,22,.4);color:var(--orange);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:700;width:100%;transition:all .15s" onmouseover="this.style.background='rgba(249,115,22,.2)'" onmouseout="this.style.background='rgba(249,115,22,.1)'">+ Añadir especificación</button>
      </div>
      <div class="full">
        <label class="flabel">Imágenes (URLs)</label>
        <div class="imgs-editor" id="imgs-editor"></div>
        <button onclick="addImg()" style="margin-top:8px;background:rgba(249,115,22,.1);border:1px dashed rgba(249,115,22,.4);color:var(--orange);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:700;width:100%;transition:all .15s" onmouseover="this.style.background='rgba(249,115,22,.2)'" onmouseout="this.style.background='rgba(249,115,22,.1)'">+ Añadir imagen</button>
      </div>
      <div class="full">
        <label class="flabel">Videos de YouTube (URLs)</label>
        <div class="vids-editor" id="vids-editor"></div>
        <button onclick="addVid()" style="margin-top:8px;background:rgba(249,115,22,.1);border:1px dashed rgba(249,115,22,.4);color:var(--orange);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:12px;font-weight:700;width:100%;transition:all .15s" onmouseover="this.style.background='rgba(249,115,22,.2)'" onmouseout="this.style.background='rgba(249,115,22,.1)'">+ Añadir video</button>
      </div>
      <div class="full">
        <label class="flabel">Estado</label>
        <div class="toggle-wrap">
          <div class="toggle on" id="f-activo-toggle" onclick="toggleActivo()"></div>
          <span id="f-activo-label">Activo (visible en catálogo)</span>
        </div>
      </div>
    </div>
    <div class="fform-footer">
      <button class="btn-cancel" onclick="closeForm()">Cancelar</button>
      <button class="btn-save" id="btn-save" onclick="saveProduct()">Guardar producto</button>
    </div>
  </div>
</div>

<script>
// ── Firebase ── REEMPLAZA CON TU CONFIGURACIÓN ────────────────────────────
const FC = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_PROJECT.firebaseapp.com",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_PROJECT.appspot.com",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID"
};
firebase.initializeApp(FC);
const db   = firebase.firestore();
const auth = firebase.auth();

// ── Estado ────────────────────────────────────────────────────────────────────
let prods = [], editId = null, activoCurrent = true, activeFilter = 'all';

// ── Auth ──────────────────────────────────────────────────────────────────────
auth.onAuthStateChanged(u => {
  if (u) { document.getElementById('login-screen').style.display='none'; document.getElementById('app').style.display='flex'; loadAll(); }
  else { document.getElementById('login-screen').style.display='flex'; document.getElementById('app').style.display='none'; }
});

async function doLogin() {
  const em = document.getElementById('l-email').value.trim();
  const pw = document.getElementById('l-pass').value;
  document.getElementById('l-err').textContent = '';
  try { await auth.signInWithEmailAndPassword(em, pw); }
  catch(e) { document.getElementById('l-err').textContent = 'Correo o contraseña incorrectos.'; }
}
function doLogout() { auth.signOut(); }

// ── Load ──────────────────────────────────────────────────────────────────────
async function loadAll() {
  try {
    const snap = await db.collection('ekann-catalogo').orderBy('categoria').orderBy('nombre').get();
    prods = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderSidebar();
    renderTable(prods);
  } catch(e) { document.getElementById('main').innerHTML = `<div class="loading" style="color:var(--red)">Error: ${e.message}</div>`; }
}

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const cats = ['all', ...new Set(prods.map(p=>p.categoria||'Otros').sort())];
  const counts = {};
  prods.forEach(p=>{ const c=p.categoria||'Otros'; counts[c]=(counts[c]||0)+1; });
  document.getElementById('sidebar-cats').innerHTML = cats.map(c => `
    <div class="side-item${c===activeFilter?' active':''}" onclick="filterCat('${c}')">
      ${c==='all'?'Todos los productos':c}
      <span class="side-count">${c==='all'?prods.length:(counts[c]||0)}</span>
    </div>`
  ).join('');
}

function filterCat(cat) {
  activeFilter = cat;
  document.querySelectorAll('.side-item').forEach(el => {
    el.classList.toggle('active', (cat==='all'?'Todos los productos':cat)===el.childNodes[0].textContent.trim()||(cat==='all'&&el.childNodes[0].textContent.trim()==='Todos los productos'));
  });
  renderSidebar();
  const filtered = cat==='all' ? prods : prods.filter(p=>(p.categoria||'Otros')===cat);
  renderTable(filtered);
}

// ── Table ─────────────────────────────────────────────────────────────────────
function renderTable(list) {
  const main = document.getElementById('main');
  if (!list.length) { main.innerHTML='<div class="empty-state">Sin productos en esta categoría.</div>'; return; }
  main.innerHTML = `
    <div class="table-wrap">
      <div class="table-head">
        <div>
          <div class="table-title">${activeFilter==='all'?'Todos los productos':activeFilter}</div>
          <div class="table-sub">${list.length} producto${list.length!==1?'s':''}</div>
        </div>
      </div>
      <table>
        <thead><tr>
          <th>Imagen</th><th>Nombre</th><th>Marca</th><th>SKU</th><th>Categoría</th><th>Estado</th><th>Acciones</th>
        </tr></thead>
        <tbody>
          ${list.map(p=>`
            <tr>
              <td><div class="td-img">${p.imagenes&&p.imagenes[0]?`<img src="${e(p.imagenes[0])}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=no-img>📦</div>'">`:'<div class="no-img" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.3">📦</div>'}</div></td>
              <td><div class="td-name">${e(p.nombre||'—')}</div>${p.sku?`<div class="td-sku">${e(p.sku)}</div>`:''}</td>
              <td>${e(p.marca||'—')}</td>
              <td><code style="font-size:11px;color:var(--muted)">${e(p.sku||'—')}</code></td>
              <td><div class="td-cat">${e(p.categoria||'—')}</div></td>
              <td><span class="badge ${p.activo!==false?'on':'off'}">${p.activo!==false?'Activo':'Oculto'}</span></td>
              <td><div class="actions">
                <button class="btn-edit" onclick="openForm('${e(p.id)}')">Editar</button>
                <button class="btn-del" onclick="delProduct('${e(p.id)}','${e(p.nombre||'')}')">×</button>
              </div></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

// ── Form ──────────────────────────────────────────────────────────────────────
function openForm(id) {
  editId = id || null;
  const p = id ? prods.find(x=>x.id===id) : null;
  document.getElementById('form-title').textContent = p ? 'Editar Producto' : 'Nuevo Producto';
  document.getElementById('f-nombre').value = p?.nombre || '';
  document.getElementById('f-sku').value    = p?.sku    || '';
  document.getElementById('f-marca').value  = p?.marca  || '';
  document.getElementById('f-cat').value    = p?.categoria || '';
  document.getElementById('f-desc').value   = p?.descripcion || '';
  activoCurrent = p ? p.activo !== false : true;
  updateActivoUI();

  // Specs
  const se = document.getElementById('specs-editor');
  se.innerHTML = '';
  (p?.caracteristicas || ['']).forEach(s => addSpecRow(s));

  // Images
  const ie = document.getElementById('imgs-editor');
  ie.innerHTML = '';
  (p?.imagenes || ['']).forEach(u => addImgRow(u));

  // Videos
  const ve = document.getElementById('vids-editor');
  ve.innerHTML = '';
  (p?.videos || []).forEach(u => addVidRow(u));
  if (!(p?.videos?.length)) addVidRow('');

  document.getElementById('fmodal-bg').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeForm() { document.getElementById('fmodal-bg').classList.remove('open'); document.body.style.overflow=''; editId=null; }

function toggleActivo() { activoCurrent=!activoCurrent; updateActivoUI(); }
function updateActivoUI() {
  const t = document.getElementById('f-activo-toggle');
  const l = document.getElementById('f-activo-label');
  t.classList.toggle('on', activoCurrent);
  l.textContent = activoCurrent ? 'Activo (visible en catálogo)' : 'Oculto (no aparece en catálogo)';
}

function addSpec(val='') {
  const se = document.getElementById('specs-editor');
  addSpecRow(val);
}
function addSpecRow(val='') {
  const se = document.getElementById('specs-editor');
  const d = document.createElement('div'); d.className='spec-row-edit';
  d.innerHTML = `<input class="finput" value="${e(val)}" placeholder="Ej: Capacidad: 12,000 lbs">
    <button class="btn-spec-del" onclick="this.parentElement.remove()">×</button>`;
  se.appendChild(d);
}

function addImg(val='') { addImgRow(val); }
function addImgRow(val='') {
  const ie = document.getElementById('imgs-editor');
  const d = document.createElement('div'); d.className='img-row';
  d.innerHTML = `<div class="img-preview"><img src="${e(val)}" onerror="this.style.display='none'" style="${val?'':'display:none'}"></div>
    <input class="finput" value="${e(val)}" placeholder="https://... URL de imagen" oninput="updateImgPreview(this)">
    <button class="btn-spec-del" onclick="this.parentElement.remove()">×</button>`;
  ie.appendChild(d);
}
function updateImgPreview(inp) {
  const img = inp.parentElement.querySelector('img');
  img.src = inp.value; img.style.display = inp.value ? '' : 'none';
}

function addVid(val='') { addVidRow(val); }
function addVidRow(val='') {
  const ve = document.getElementById('vids-editor');
  const d = document.createElement('div'); d.className='spec-row-edit';
  d.innerHTML = `<input class="finput" value="${e(val)}" placeholder="https://youtube.com/watch?v=...">
    <button class="btn-spec-del" onclick="this.parentElement.remove()">×</button>`;
  ve.appendChild(d);
}

async function saveProduct() {
  const nombre = document.getElementById('f-nombre').value.trim();
  const cat    = document.getElementById('f-cat').value;
  if (!nombre || !cat) { alert('Nombre y categoría son obligatorios.'); return; }

  const specs = [...document.querySelectorAll('#specs-editor .finput')].map(i=>i.value.trim()).filter(Boolean);
  const imgs  = [...document.querySelectorAll('#imgs-editor input.finput')].map(i=>i.value.trim()).filter(Boolean);
  const vids  = [...document.querySelectorAll('#vids-editor .finput')].map(i=>i.value.trim()).filter(Boolean);

  const data = {
    nombre, categoria:cat,
    sku: document.getElementById('f-sku').value.trim(),
    marca: document.getElementById('f-marca').value.trim(),
    descripcion: document.getElementById('f-desc').value.trim(),
    caracteristicas: specs, imagenes: imgs, videos: vids,
    activo: activoCurrent,
    updatedAt: Date.now(),
  };

  const btn = document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='Guardando...';
  try {
    if (editId) {
      await db.collection('ekann-catalogo').doc(editId).update(data);
      const idx = prods.findIndex(x=>x.id===editId);
      if (idx!==-1) prods[idx] = {...prods[idx],...data};
    } else {
      data.createdAt = Date.now();
      const ref = await db.collection('ekann-catalogo').add(data);
      prods.push({id:ref.id,...data});
    }
    closeForm(); renderSidebar(); filterCat(activeFilter); toast('Producto guardado ✓');
  } catch(err) { alert('Error: '+err.message); }
  finally { btn.disabled=false; btn.textContent='Guardar producto'; }
}

async function delProduct(id, nombre) {
  if (!confirm(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`)) return;
  try {
    await db.collection('ekann-catalogo').doc(id).delete();
    prods = prods.filter(p=>p.id!==id);
    renderSidebar(); filterCat(activeFilter); toast('Producto eliminado');
  } catch(e) { alert('Error: '+e.message); }
}

// ── Search ────────────────────────────────────────────────────────────────────
let st;
document.getElementById('search-in').addEventListener('input', ev => {
  clearTimeout(st);
  st = setTimeout(() => {
    const q = ev.target.value.trim().toLowerCase();
    if (!q) { filterCat(activeFilter); return; }
    const res = prods.filter(p=>[p.nombre,p.marca,p.sku,p.categoria,p.descripcion,...(p.caracteristicas||[])].join(' ').toLowerCase().includes(q));
    renderTable(res);
  }, 200);
});

// ── Util ──────────────────────────────────────────────────────────────────────
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function toast(msg) {
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2800);
}
</script>
</body>
</html>
